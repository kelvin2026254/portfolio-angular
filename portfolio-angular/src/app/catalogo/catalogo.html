<section class="catalogo">

  <div class="catalogo-header">
    <span class="header-tag">Tecnologias</span>
    <h2>Meu Catálogo</h2>
    <p>Conhecimentos e tecnologias que fazem parte da minha jornada.</p>
  </div>

  @if (carregando) {
    <p>Carregando catalogo...</p>
  }

  @if (erro) {
    <p>{{ erro }}</p>
  }

  @for (t of tecnologias; track t.id) {
    <mat-card>
      <mat-card-header>
        <mat-card-title>{{ t.nome }}</mat-card-title>
        <mat-card-subtitle>{{ t.categoria }}</mat-card-subtitle>
      </mat-card-header>

      <mat-card-content>
        {{ t.descricao }}
      </mat-card-content>
    </mat-card>
  }

</section>
