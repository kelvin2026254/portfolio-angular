<header class="navbar">
  <div class="logo">Meu Portfólio</div>

  <button class="menu-btn" (click)="toggleMenu()" aria-label="Abrir menu">
    <span class="bar"></span>
    <span class="bar"></span>
    <span class="bar"></span>
  </button>
</header>

<div
  class="backdrop"
  [class.active]="menuAberto"
  (click)="fecharMenu()">
</div>

<nav class="sidebar" [class.open]="menuAberto">
  <div class="sidebar-header">
    <span>Navegação</span>

    <button
      class="close-btn"
      (click)="fecharMenu()"
      aria-label="Fechar menu">
      &times;
    </button>
  </div>

  <div class="nav-links">

    <a
      routerLink="/"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      (click)="fecharMenu()">
      Home
    </a>

    <a
      routerLink="/sobre"
      routerLinkActive="active"
      (click)="fecharMenu()">
      Sobre
    </a>

    <a
      routerLink="/projetos"
      routerLinkActive="active"
      (click)="fecharMenu()">
      Projetos
    </a>

    <a
      routerLink="/catalogo"
      routerLinkActive="active"
      (click)="fecharMenu()">
      Catálogo
    </a>

    <a
      routerLink="/contato"
      routerLinkActive="active"
      (click)="fecharMenu()">
      Contato
    </a>

    <a
      routerLink="/gestao"
      routerLinkActive="active"
      (click)="fecharMenu()">
      Gestão
    </a>

  </div>
</nav>

<router-outlet></router-outlet>
